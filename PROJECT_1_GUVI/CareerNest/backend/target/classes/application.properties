spring.application.name=careernest-backend
server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/careernest}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-please-use-a-long-random-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.seed-data=${APP_SEED_DATA:true}

twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
